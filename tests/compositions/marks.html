<!doctype html>
<!-- Test: the product's mark in every form. The default, a bare logo in its own colours coming into
     focus with its glow, in the closing lockup and filling the frame; an app icon that draws its own
     tile (tile "own") opening the next scene; a gradient tile (background) filling the frame with
     the flat brand colour; a tile with the older "pop" landing and its ring; and the brand orb (no
     logo) shown on its own. -->
<html lang="en" data-resolution="landscape">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="assets/vendor/gsap.min.js"></script>
<link rel="stylesheet" href="assets/launch/launch.css" />
<script src="assets/launch/launch-text.js"></script>
<script src="assets/launch/launch-motion.js"></script>
<style>
@font-face { font-family: 'Geist'; font-style: normal; font-weight: 600; font-display: block; src: url('assets/fonts/geist-600-normal-latin.woff2') format('woff2'); }
:root { --lt-font: "Geist", sans-serif; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fdfdfd; }
#root { position: relative; width: 100%; height: 100%; }
.scene { position: absolute; inset: 0; overflow: hidden; background: #eef2ff; }
.scene h1 { position: absolute; left: 200px; top: 200px; font: 600 80px "Geist", sans-serif; color: #111827; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1920" data-height="1080">
  <div id="sA" class="lt-stage"></div>
  <div id="sB" class="scene"><h1>The next scene</h1></div>
  <div id="sC" class="lt-stage"></div>
  <div id="sD" class="lt-stage"></div>
  <div id="sE" class="lt-stage"></div>
  <div id="sF" class="lt-stage"></div>
  <div id="sG" class="lt-stage"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
function build() {
  const L = window.LaunchText, M = window.LaunchMotion;
  const $ = (id) => document.getElementById(id);
  const A = $("sA"), B = $("sB"), C = $("sC"), D = $("sD"), E = $("sE"), F = $("sF"), G = $("sG");
  const APP = '<svg viewBox="0 0 100 100"><defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/>' +
    '<stop offset="1" stop-color="#db2777"/></linearGradient></defs><rect width="100" height="100" rx="23" fill="url(#ag)"/>' +
    '<path d="M50 24 L72 33 V51 C72 64 62 73 50 77 C38 73 28 64 28 51 V33 Z" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/></svg>';
  L.theme({ ...L.PRESETS.light, mark: { name: "Acme", tile: "own", svg: APP, color: "#7c3aed" } }, A);
  const SHIELD = '<svg viewBox="0 0 100 100" fill="none"><path d="M50 18 L76 29 V51 C76 67 64 78 50 83 C36 78 24 67 24 51 V29 Z" stroke="#fff" stroke-width="8" stroke-linejoin="round"/></svg>';
  L.theme({ ...L.PRESETS.light, mark: { name: "Acme", background: "linear-gradient(135deg, #1d4ed8 0%, #0ea5e9 100%)", svg: SHIELD } }, C);
  // the default: the logo in its own colours, bare on the canvas
  const PETAL = '<svg viewBox="14 18 72 72"><path d="M18 40 C18 28 82 28 82 40 C82 46 70 50 50 50 C30 50 18 46 18 40 Z" fill="#9ca3af"/>' +
    '<path d="M24 50 C34 56 66 56 76 50 C72 70 60 80 50 80 C40 80 28 70 24 50 Z" fill="#1f2937"/></svg>';
  L.theme({ ...L.PRESETS.light, mark: { name: "Petal", svg: PETAL, color: "#6b7280" } }, D);
  L.theme({ bg: "#0b1220", ink: "#e8eef7", accent: "#22d3ee", mark: { name: "Petal", svg: PETAL.replace("#1f2937", "#e5e7eb"), color: "#22d3ee" } }, E);
  // the older landing, asked for: a tile that pops in with its ring
  L.theme({ ...L.PRESETS.dark, mark: { name: "Acme", tile: true, land: "pop", svg: SHIELD, color: "#2563eb" } }, F);
  // no logo: the brand orb (orb: true says so, so the forgotten-logo note stays quiet)
  L.theme({ ...L.PRESETS.dark, mark: { name: "Acme", color: "#f97316", orb: true } }, G);

  const a = L.statement(tl, A, { at: 0.1, lines: ["An app icon opens it"], hold: 1.3, exit: "mark", markEnd: "open", next: B });
  M.cut(tl, { at: a.end + 1.0, from: B, to: C });
  const c = L.statement(tl, C, { at: a.end + 1.0, lines: ["A gradient fills it"], hold: 1.3, exit: "mark", markEnd: "fill" });
  M.cut(tl, { at: c.end + 0.8, from: C, to: D });
  const d = L.statement(tl, D, { at: c.end + 0.8, lines: ["The logo, as it is"], hold: 1.3, exit: "mark", markEnd: "lockup" });
  M.cut(tl, { at: d.end + 1.2, from: D, to: E });
  const e = L.statement(tl, E, { at: d.end + 1.2, lines: ["A bare logo fills it"], hold: 1.3, exit: "mark", markEnd: "fill" });
  M.cut(tl, { at: e.end + 0.8, from: E, to: F });
  const f = L.statement(tl, F, { at: e.end + 0.8, lines: ["The icon, when asked"], hold: 1.3, exit: "mark", markEnd: "hide" });
  M.cut(tl, { at: f.end + 0.3, from: F, to: G });
  L.mark(tl, G, { at: f.end + 0.5, keep: true });
  window.__marks = { a, c, d, e, f };
  window.__timelines["main"] = tl;
}
document.fonts.ready.then(build);
</script>
</body></html>
