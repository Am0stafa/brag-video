<!doctype html>
<!-- The launch style in one composition: a working example for /brag (references/launch-style.md).
     Horse Tinder is a fictional app from the /brag examples.

     Build steps it shows:
       1. copy assets/launch/ (launch-text.js, launch-motion.js, launch-ui.js, launch.css) into
          composition/assets/launch/, keep GSAP in assets/vendor/, paste the product's @font-face rules
          into <style>, and name that family in --lt-font;
       2. set the theme from the app (LaunchText.theme): here light, a dark scene, and a brand-dark close,
          with the product's mark (its logo in its own colours, shown bare; an app-icon tile only when
          the user asks for one: tile: true, a gradient `background`, or tile: "own");
       3. write statements, and join scenes with the transitions (the icon opening like an app, warp,
          camera, focus), and give the logo its own motion (here the horseshoe swings on its nail);
       4. animate the product screen with launch-ui.js: the search typed by a scene clock, the results
          arriving with their counts, a cursor click, and the "Sample data" label;
       5. as soon as the statements are built, check that each one can be read, and fix every SHORT
          row before composing the music:
            node /skill/launch_events.cjs composition/index.html
       6. for the sound, once the timeline is final:
            node /skill/launch_events.cjs composition/index.html tools/launch-events.json
            python3 /skill/typing_track.py tools/launch-events.json --out composition/assets/sfx/typing.wav \
                --music composition/assets/music/score.wav --music-volume 0.45 \
                --duck-music composition/assets/music/score-ducked.wav --placed tools/typing-placed.json
            python3 /skill/sfx_tags.py tools/sfx.json --events tools/launch-events.json --into composition/index.html
          keep the two <audio> lines below (the ducked music on track 10, typing on track 11); the
          click and key sounds from tools/sfx.json land between the sfx markers. -->
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/launch/launch.css" />
    <script src="assets/launch/launch-text.js"></script>
    <script src="assets/launch/launch-motion.js"></script>
    <script src="assets/launch/launch-ui.js"></script>
    <style>
      @font-face { font-family: 'Geist'; font-style: normal; font-weight: 600; font-display: block; src: url('assets/fonts/geist-600-normal-latin.woff2') format('woff2'); }
      :root { --lt-font: "Geist", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fdfdfd; }
      #root { position: relative; width: 100%; height: 100%; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      /* the product screen, rebuilt at full size so the camera can move over it */
      #sUI { background: #f4f6fb; }
      #ui { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .card { position: absolute; left: 460px; top: 300px; width: 1000px; height: 480px; background: #ffffff;
        border-radius: 28px; box-shadow: 0 30px 80px rgba(20, 30, 60, 0.12); font-family: "Geist", sans-serif; }
      .field { position: absolute; left: 60px; top: 60px; width: 880px; height: 96px; border-radius: 48px;
        background: #f1f3f8; color: #111827; font-size: 34px; line-height: 96px; padding-left: 44px; font-weight: 600;
        white-space: nowrap; }
      .field i { display: inline-block; width: 3px; height: 38px; margin-left: 3px; vertical-align: -6px; background: #111827; }
      .row { position: absolute; left: 60px; width: 880px; height: 64px; border-radius: 16px; background: #f7f8fb;
        color: #111827; font-size: 28px; line-height: 64px; padding-left: 28px; font-weight: 600; }
      .row b { color: #0a6b3d; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.5" data-width="1920" data-height="1080">
      <!-- scenes are plain layers; the engine shows and hides them at their transitions -->
      <div id="sLight" class="lt-stage"></div>
      <div id="sDark" class="lt-stage"></div>
      <div id="sUI" class="scene">
        <div id="ui" data-layout-allow-overflow>
          <div class="card">
            <div class="field"><span id="query"></span><i id="caret"></i></div>
            <div class="row" style="top: 200px">Thunder · <b id="fit1">92% fit</b> · 4 km away</div>
            <div class="row" style="top: 280px">Maple · <b id="fit2">88% fit</b> · 6 km away</div>
            <div class="row" style="top: 360px">Juniper · <b id="fit3">81% fit</b> · 9 km away</div>
          </div>
        </div>
      </div>
      <div id="sBrand" class="lt-stage"></div>
      <audio id="music" src="assets/music/score-ducked.wav" data-start="0" data-duration="22.5" data-track-index="10" data-volume="0.45"></audio>
      <audio id="typing" src="assets/sfx/typing.wav" data-start="0" data-duration="22.5" data-track-index="11" data-volume="1"></audio>
      <!-- sfx:begin -->
      <!-- sfx:end -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      function build() {
        const L = window.LaunchText, M = window.LaunchMotion, U = window.LaunchUI, F = 1 / 30;
        const $ = (id) => document.getElementById(id);
        const light = $("sLight"), dark = $("sDark"), uiScene = $("sUI"), ui = $("ui"), brand = $("sBrand");
        // labels the app cuts with "…" are cut first, before anything is measured (none here)
        U.ellipsis(ui);
        // 1. themes: a light canvas, a black scene, and the app's own dark brand colours; the mark
        //    is the product's logo (a horseshoe) in its own colours, bare on the canvas: it comes
        //    into focus with a soft glow (a product with no logo leaves out svg and gets the brand
        //    orb, which breathes; tile: true puts the logo on an app-icon tile, only when asked)
        const HORSESHOE = {
          name: "Horse Tinder",
          color: "#4f8cff",
          svg: '<svg viewBox="0 0 100 100" fill="none"><path d="M30.3 21.8A32 32 0 1 0 69.7 21.8" stroke="#4f8cff" ' +
            'stroke-width="16" stroke-linecap="round"/><g fill="#ffffff"><circle cx="21" cy="33.5" r="2.6"/>' +
            '<circle cx="19.1" cy="55.3" r="2.6"/><circle cx="31.6" cy="73.2" r="2.6"/><circle cx="79" cy="33.5" r="2.6"/>' +
            '<circle cx="80.9" cy="55.3" r="2.6"/><circle cx="68.4" cy="73.2" r="2.6"/></g></svg>'
        };
        L.theme({ ...L.PRESETS.light, mark: HORSESHOE });
        L.theme("dark", dark);
        L.theme({ bg: "#0b1220", ink: "#e8eef7", accent: "#4f8cff", mark: HORSESHOE }, brand);
        // the music's beats (tools/score.json: 124 BPM, first beat at 0); a bundled track passes
        // its cue file's tempo and beats instead. The brand orb (no logo) breathes on them.
        L.music({ bpm: 124 });
        // the logo's own motion: the horseshoe swings once on its nail as it comes into focus
        const swing = (s) => s.glyph && tl.fromTo(s.glyph, { rotation: -18, transformOrigin: "50% 12%" },
          { rotation: 0, duration: 1.0, ease: "elastic.out(1, 0.35)" }, s.markAt);
        // 2. the title: the first word streams in token pieces, the lit word flickers and settles
        const a = L.statement(tl, light, { at: 0.1, lines: ["Horse Tinder for {Riders}"], hold: 1.2 });
        // two lines, broken by meaning; the finished line slides out to the left
        const b = L.statement(tl, light, { at: a.end + F, lines: ["Find the horse that fits", "your weekends and your pace"],
          hold: 1.7, exit: "slide" });
        // a slot, then the line condenses into the product's logo, which opens the dark scene like an app
        const c = L.statement(tl, light, { at: b.end + 0.1, lines: ["Match on {slot}"], slot: ["temperament", "pasture", "trust"],
          hold: 1.2, exit: "mark", markEnd: "open", next: dark });
        swing(c);
        // 3. the dark scene: thinking dots, then a caret types the rest; it stays (exit "none")
        //    until the warp takes the scene away
        const d = L.statement(tl, dark, { at: c.end + 0.2, lines: ["Your rides stay private.", "Zero data shared."],
          think: { after: 1, dur: 0.9 }, hold: 1.4, exit: "none" });
        // 4. warp out of the dark scene into the product screen
        const w = M.warp(tl, { at: d.exitAt, from: dark, to: uiScene, color: "#f4f6fb" });
        // deep zoom on the search field, follow the typing, pull back to show the whole screen
        M.camera(tl, ui, [
          { t: w.end, x: 700, y: 408, zoom: 2.4 },
          { t: w.end + 1.3, x: 1150, y: 408, zoom: 2.4 },
          { t: w.end + 2.0, x: 960, y: 540, zoom: 1 }
        ]);
        // the product at work, with launch-ui.js: every changing value comes from one scene clock
        const SEARCH = "Calm horse for trail rides near me", typeAt = w.end + 0.15, cps = 28;
        const typed = U.doneAt(SEARCH, typeAt, cps);
        const rowsAt = typed + 0.2, rows = ui.querySelectorAll(".row");
        U.show(tl, rows, rowsAt, { stagger: 0.15, y: 10 });
        U.clock(tl, (t) => {
          $("query").textContent = U.typed(SEARCH, typeAt, cps, t);
          $("caret").style.opacity = t >= typeAt && t < rowsAt && U.caret(t, typed) ? "1" : "0";
          [92, 88, 81].forEach((v, i) => { $("fit" + (i + 1)).textContent = U.count(v, rowsAt + i * 0.15, 0.6, t, { suffix: "% fit" }); });
        });
        U.keys(typeAt, SEARCH, cps);   // key sounds for the search: every second character, 90 ms apart
        // the cursor glides in once the camera has pulled back, clicks the best match, and leaves
        const clickAt = w.end + 2.7;
        U.cursor(tl, ui, [{ t: w.end + 2.1, at: [1380, 860] }, { t: clickAt, at: rows[0], fx: 0.3, click: true, hide: true }]);
        U.fromTo(tl, rows[0], { backgroundColor: "#f7f8fb" }, { backgroundColor: "#e6efff", duration: 0.2 }, clickAt);
        U.sample(uiScene);   // pinned to the frame while the camera moves the screen
        // 5. a focus pull into the brand's own dark theme for the close; the line becomes the logo,
        //    which slides left while the product's name types in beside it: the closing lockup
        const f = M.focus(tl, { at: clickAt + 0.5, from: uiScene, to: brand });
        const g = L.statement(tl, brand, { at: f.end, lines: ["Swipe right on your next {ride}"], flickerAll: true, hold: 1.4,
          exit: "mark", markEnd: "lockup" });
        swing(g);
        window.__timelines["main"] = tl;
      }
      document.fonts.ready.then(build);
    </script>
  </body>
</html>
